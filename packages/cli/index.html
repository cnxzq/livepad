<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>livepad</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; color: #d4d4d4; font-family: system-ui, sans-serif; }
    .app { display: flex; height: 100%; }
    .login-view { height: 100%; display: grid; place-items: center; padding: 24px; overflow-y: auto; }
    .login-card { width: 100%; max-width: 380px; padding: 32px; border: 1px solid #333; border-radius: 12px; background: #252525; }
    .login-card h1 { font-size: 28px; margin-bottom: 12px; color: #eee; }
    .login-hint { font-size: 14px; line-height: 1.6; color: #aaa; margin-bottom: 24px; }
    .login-card label { display: block; font-size: 13px; margin-bottom: 8px; }
    .login-card input { width: 100%; padding: 12px; border: 1px solid #555; border-radius: 6px; background: #1e1e1e; color: #eee; font: inherit; }
    .login-card input:focus { outline: 2px solid #569cd6; outline-offset: 2px; }
    .login-card .btn { width: 100%; margin-top: 16px; padding: 11px; font-size: 14px; }
    .login-card .btn:disabled { opacity: .6; cursor: wait; }
    .login-error { min-height: 1.5em; margin-top: 16px; color: #f88; font-size: 13px; line-height: 1.5; }

    .editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    textarea {
      display: block; width: 100%; height: 100%; border: none; outline: none;
      resize: none; padding: 24px; font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 16px; line-height: 1.6; color: #d4d4d4; background: #1e1e1e;
      caret-color: #569cd6;
    }
    textarea::selection { background: #264f78; }

    .attach-pane {
      width: 260px; min-width: 260px; border-left: 1px solid #333;
      display: flex; flex-direction: column; background: #1a1a1a;
    }
    .attach-header {
      padding: 16px 16px 14px; border-bottom: 1px solid #2a2a2a;
    }
    .attach-title { font-size: 13px; color: #888; font-weight: 600; margin-bottom: 10px; }
    .header-actions { display: flex; gap: 8px; }
    .btn {
      font-size: 11px; padding: 4px 10px; border: 1px solid #444; border-radius: 4px;
      background: #252525; color: #aaa; cursor: pointer; transition: .15s;
    }
    .btn:hover { background: #333; color: #ddd; border-color: #666; }
    .btn.danger:hover { background: #5a2020; border-color: #c44; color: #f88; }
    .btn.primary { border-color: #569cd6; color: #569cd6; }
    .btn.primary:hover { background: #1a3a5c; }

    .attach-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .attach-item {
      display: flex; align-items: center; padding: 8px 12px; font-size: 13px;
      border-bottom: 1px solid #222; transition: background .1s;
    }
    .attach-item:hover { background: #252525; }
    .attach-icon { font-size: 16px; margin-right: 8px; flex-shrink: 0; }
    .attach-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #ccc; text-decoration: none;
    }
    .attach-name:hover { color: #569cd6; text-decoration: underline; }
    .attach-size { color: #666; font-size: 11px; margin: 0 8px; flex-shrink: 0; }
    .attach-del {
      color: #666; cursor: pointer; font-size: 14px; flex-shrink: 0;
      padding: 2px 5px; border-radius: 3px;
    }
    .attach-del:hover { color: #f44; background: #3a1515; }
    .empty { text-align: center; color: #555; padding: 30px 16px; font-size: 13px; }
    #fileInput { display: none; }
    .status { font-size: 12px; color: #555; pointer-events: none; transition: opacity 0.3s; }
    .editor-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 24px 8px; border-top: 1px solid #2a2a2a; flex-shrink: 0;
    }
    .lang-switch { display: flex; gap: 2px; }
    .btn.lang {
      font-size: 11px; padding: 2px 7px; border: 1px solid transparent; border-radius: 3px;
      background: transparent; color: #555; cursor: pointer;
    }
    .btn.lang:hover { color: #999; background: #2a2a2a; }
    .btn.lang.active { color: #569cd6; border-color: #3a3a3a; background: #252525; font-weight: 600; }
    @media (max-width: 640px) {
      .attach-pane { width: 100%; min-width: 0; height: 180px; border-left: none; border-top: 1px solid #333; flex-shrink: 0; }
      .app { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="login-view" id="loginView">
    <form class="login-card" id="loginForm" action="/auth/login" method="post">
      <h1>livepad</h1>
      <p class="login-hint" id="t-loginHint">Enter the access password shown in the server startup log.</p>
      <label for="passwordInput" id="t-password">Access password</label>
      <input id="passwordInput" type="password" autocomplete="current-password" required maxlength="128">
      <button class="btn primary" id="loginButton" type="submit"><span id="t-unlock">Sign in</span></button>
      <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <div class="app" id="workspace" hidden>
    <div class="editor-pane">
      <textarea id="editor" spellcheck="false"></textarea>
      <div class="editor-foot">
        <span class="status" id="status"></span>
        <div class="lang-switch">
          <button class="btn lang" id="lang-zh">中文</button>
          <button class="btn lang active" id="lang-en">EN</button>
        </div>
      </div>
    </div>
    <div class="attach-pane">
      <div class="attach-header">
        <div class="attach-title">📎 <span id="t-attachments">Attachments</span></div>
        <div class="header-actions">
          <button class="btn primary" id="btnUpload"><span id="t-upload">Upload</span></button>
          <button class="btn danger" id="btnClear"><span id="t-clear">Clear</span></button>
        </div>
      </div>
      <div class="attach-list" id="attachList">
        <div class="empty" id="t-empty">No attachments</div>
      </div>
      <input type="file" id="fileInput" multiple>
    </div>
  </div>

  <script>
    // --- i18n ---
    const T = {
      en: {
        placeholder: 'Start typing... (all connected clients sync in real-time)',
        attachments: 'Attachments',
        upload: 'Upload',
        clear: 'Clear',
        clearConfirm: 'Clear all attachments?',
        empty: 'No attachments',
        connected: 'Connected',
        disconnected: 'Disconnected — reconnecting...',
        uploadFailed: 'Upload failed',
        requestFailed: 'Request failed',
        unsynced: 'Text not synced — local changes kept; edit to retry',
        synced: 'Text synced',
        loginHint: 'Enter the access password shown in the server startup log.',
        password: 'Access password',
        unlock: 'Sign in',
        incorrectPassword: 'Incorrect password. Check the latest startup log.',
        loginLimited: 'Too many attempts. Try again in one minute.',
        loginFailed: 'Unable to sign in. Check the connection and try again.',
        sessionExpired: 'Please sign in again with the current access password. Unsynced edits are kept in this tab.',
        title: 'livepad — Realtime Collaborative Notepad',
      },
      zh: {
        placeholder: '在此输入...（所有连接的客户端将实时同步）',
        attachments: '附件',
        upload: '上传',
        clear: '清空',
        clearConfirm: '确定清空所有附件？',
        empty: '暂无附件',
        connected: '已连接',
        disconnected: '已断开 — 正在重连...',
        uploadFailed: '上传失败',
        requestFailed: '请求失败',
        unsynced: '文本未同步，本地修改已保留；编辑后重试',
        synced: '文本已同步',
        loginHint: '请输入服务端启动日志中显示的访问密码。',
        password: '访问密码',
        unlock: '登录',
        incorrectPassword: '密码错误，请查看最新的启动日志。',
        loginLimited: '尝试次数过多，请一分钟后重试。',
        loginFailed: '无法登录，请检查连接后重试。',
        sessionExpired: '请使用当前访问密码重新登录，未同步的修改仍保留在本标签页中。',
        title: 'livepad — 实时协作便签',
      },
    };

    let lang = (navigator.language || '').startsWith('zh') ? 'zh' : 'en';
    function t(key) { return T[lang][key]; }
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('title');
      editor.placeholder = t('placeholder');
      document.querySelectorAll('[id^="t-"]').forEach(el => {
        const k = el.id.replace('t-', '');
        if (T[lang][k]) el.textContent = T[lang][k];
      });
      document.getElementById('lang-zh').classList.toggle('active', lang === 'zh');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      // Re-render file list (refresh empty text)
      renderFiles(currentFiles);
    }

    document.getElementById('lang-zh').addEventListener('click', () => { lang = 'zh'; applyLang(); });
    document.getElementById('lang-en').addEventListener('click', () => { lang = 'en'; applyLang(); });

    // --- App ---
    const editor = document.getElementById('editor');
    const attachList = document.getElementById('attachList');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const loginView = document.getElementById('loginView');
    const workspace = document.getElementById('workspace');
    const passwordInput = document.getElementById('passwordInput');
    const loginButton = document.getElementById('loginButton');
    const loginError = document.getElementById('loginError');

    const IDLE_MS = 500;
    let connected = false, lastLocalInput = 0, pendingRemote = null, idleTimer = null;
    let currentFiles = [];
    let hasUnsyncedText = false, localRevision = 0, updateInFlight = false;
    let statusTimer = null;
    let authenticated = false, eventSource = null, reconnectTimer = null;

    function showLogin(message = '') {
      authenticated = false;
      connected = false;
      if (eventSource) eventSource.close();
      eventSource = null;
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = null;
      workspace.hidden = true;
      loginView.hidden = false;
      loginError.textContent = message;
    }

    function showWorkspace() {
      authenticated = true;
      loginView.hidden = true;
      workspace.hidden = false;
      passwordInput.value = '';
      loginError.textContent = '';
      connect();
    }

    async function authenticatedFetch(url, options) {
      const response = await fetch(url, options);
      if (response.status === 401) {
        showLogin(t('sessionExpired'));
        throw new Error(t('sessionExpired'));
      }
      return response;
    }

    async function signIn(password) {
      if (loginButton.disabled) return;
      loginButton.disabled = true;
      loginError.textContent = '';
      try {
        const response = await fetch('/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (!response.ok) {
          loginError.textContent = t(response.status === 401 ? 'incorrectPassword'
            : response.status === 429 ? 'loginLimited' : 'loginFailed');
          return;
        }
        showWorkspace();
      } catch {
        loginError.textContent = t('loginFailed');
      } finally {
        loginButton.disabled = false;
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      await signIn(passwordInput.value);
    });

    async function restoreSession() {
      try {
        const url = new URL(location.href);
        if (url.searchParams.has('password')) {
          const password = url.searchParams.get('password');
          url.searchParams.delete('password');
          history.replaceState(history.state, '', url.pathname + url.search + url.hash);
          showLogin();
          await signIn(password);
          return;
        }
        const response = await fetch('/auth/session');
        if (response.ok) showWorkspace();
        else showLogin(response.status === 401 ? '' : t('loginFailed'));
      } catch {
        showLogin(t('loginFailed'));
      }
    }

    function setStatus(text, good, persistent = false) {
      if (statusTimer) clearTimeout(statusTimer);
      statusTimer = null;
      status.textContent = text;
      status.style.color = good ? '#4caf50' : '#f44336';
      status.style.opacity = '1';
      if (!persistent) statusTimer = setTimeout(() => { status.style.opacity = '0'; }, 3000);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function iconFor(name) {
      const ext = name.split('.').pop().toLowerCase();
      const map = {
        jpg: '🖼', jpeg: '🖼', png: '🖼', gif: '🖼', svg: '🖼', webp: '🖼',
        mp4: '🎬', mov: '🎬', avi: '🎬', webm: '🎬',
        mp3: '🎵', wav: '🎵', flac: '🎵', ogg: '🎵',
        pdf: '📕', doc: '📄', docx: '📄', txt: '📄', md: '📄',
        zip: '📦', rar: '📦', tar: '📦', gz: '📦', '7z': '📦',
      };
      return map[ext] || '📄';
    }

    function renderFiles(files) {
      currentFiles = files || [];
      attachList.replaceChildren();
      if (!currentFiles.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = t('empty');
        attachList.append(empty);
        return;
      }
      for (const file of currentFiles) {
        const item = document.createElement('div');
        item.className = 'attach-item';
        const icon = document.createElement('span');
        icon.className = 'attach-icon';
        icon.textContent = iconFor(file.name);
        const link = document.createElement('a');
        link.className = 'attach-name';
        link.href = '/file/' + encodeURIComponent(file.name);
        link.download = file.name;
        link.textContent = file.name;
        const size = document.createElement('span');
        size.className = 'attach-size';
        size.textContent = formatSize(file.size);
        const remove = document.createElement('span');
        remove.className = 'attach-del';
        remove.title = 'delete';
        remove.textContent = '✕';
        remove.addEventListener('click', async () => {
          try {
            const response = await authenticatedFetch('/file/' + encodeURIComponent(file.name), { method: 'DELETE' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
          } catch (error) {
            console.error('Delete failed', error);
            setStatus(t('requestFailed'), false);
          }
        });
        item.append(icon, link, size, remove);
        attachList.append(item);
      }
    }

    function applyRemote(text) { editor.value = text; pendingRemote = null; }
    function checkIdle() {
      idleTimer = null;
      if (hasUnsyncedText) return;
      const idle = Date.now() - lastLocalInput >= IDLE_MS;
      if (idle && pendingRemote !== null) applyRemote(pendingRemote);
      if (!idle) idleTimer = setTimeout(checkIdle, IDLE_MS);
    }

    document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());
    async function uploadFile(file) {
      const form = new FormData();
      form.append('file', file);
      const response = await authenticatedFetch('/upload', { method: 'POST', body: form });
      if (!response.ok) {
        const detail = await response.json().catch(() => null);
        throw new Error(detail?.error?.message || `HTTP ${response.status}`);
      }
    }
    fileInput.addEventListener('change', async () => {
      try {
        for (const file of fileInput.files) await uploadFile(file);
      } catch (error) {
        console.error('Upload failed', error);
        setStatus(`${t('uploadFailed')}: ${error.message}`, false);
      }
      fileInput.value = '';
    });

    document.getElementById('btnClear').addEventListener('click', async () => {
      if (!confirm(t('clearConfirm'))) return;
      try {
        const response = await authenticatedFetch('/files', { method: 'DELETE' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
      } catch (error) {
        console.error('Clear failed', error);
        setStatus(t('requestFailed'), false);
      }
    });

    function connect() {
      if (!authenticated || eventSource) return;
      reconnectTimer = null;
      const es = new EventSource('/events');
      eventSource = es;
      es.addEventListener('init', (e) => {
        const data = JSON.parse(e.data);
        if (!hasUnsyncedText) applyRemote(data.text || '');
        renderFiles(data.files || []);
        connected = true;
        if (hasUnsyncedText) setStatus(t('unsynced'), false, true);
        else setStatus(t('connected'), true);
      });
      es.addEventListener('text', (e) => {
        const content = JSON.parse(e.data);
        if (!hasUnsyncedText && Date.now() - lastLocalInput >= IDLE_MS) {
          applyRemote(content);
        } else {
          pendingRemote = content;
          if (!idleTimer) checkIdle();
        }
      });
      es.addEventListener('files', (e) => renderFiles(JSON.parse(e.data)));
      es.onerror = async () => {
        if (eventSource !== es) return;
        connected = false;
        setStatus(hasUnsyncedText ? `${t('disconnected')} — ${t('unsynced')}` : t('disconnected'), false, hasUnsyncedText);
        es.close();
        eventSource = null;
        try {
          const response = await fetch('/auth/session');
          if (response.status === 401) {
            showLogin(t('sessionExpired'));
            return;
          }
        } catch {}
        if (authenticated && !eventSource) reconnectTimer = setTimeout(connect, 3000);
      };
    }

    async function syncText() {
      if (!connected || updateInFlight || !hasUnsyncedText) return;
      const revision = localRevision;
      const content = editor.value;
      pendingRemote = null;
      updateInFlight = true;
      try {
        const response = await authenticatedFetch('/update', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => null);
          throw new Error(detail?.error?.message || `HTTP ${response.status}`);
        }
        if (revision === localRevision) {
          hasUnsyncedText = false;
          setStatus(t('synced'), true);
          if (pendingRemote !== null && !idleTimer) checkIdle();
        }
      } catch (error) {
        console.error('Update failed', error);
        if (revision === localRevision) setStatus(`${t('unsynced')}: ${error.message}`, false, true);
      } finally {
        updateInFlight = false;
        // Coalesce typing while a request is in flight; an older response must
        // never mark a newer draft as synced or race its update on the server.
        if (hasUnsyncedText && revision !== localRevision) syncText();
      }
    }

    editor.addEventListener('input', () => {
      lastLocalInput = Date.now(); pendingRemote = null;
      if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
      localRevision += 1;
      hasUnsyncedText = true;
      if (!connected) setStatus(t('unsynced'), false, true);
      syncText();
    });

    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', async e => {
      e.preventDefault();
      if (!authenticated) return;
      try {
        for (const file of e.dataTransfer.files) await uploadFile(file);
      } catch (error) {
        console.error('Upload failed', error);
        setStatus(`${t('uploadFailed')}: ${error.message}`, false);
      }
    });

    applyLang();
    restoreSession();
  </script>
</body>
</html>
